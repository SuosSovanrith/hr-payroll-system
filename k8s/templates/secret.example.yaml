# =============================================================================
# Secret TEMPLATE (safe to commit). Real values must NEVER be committed.
#
#   1. Copy this file to  k8s/02-secret.yaml   (that name is git-ignored)
#   2. Replace every REPLACE_ME with the real value
#   3. kubectl apply -f k8s/02-secret.yaml
# -----------------------------------------------------------------------------
# Owner  : Member 3
# Tips   : - Keep the double quotes; $ and other special characters are safe inside them (no interpolation here).
#          - JWT_SECRET and INTERNAL_API_KEY: any long random string, e.g. generate 64 hex characters.
#          - MONGODB_URI: the MongoDB Atlas connection string (a cloud database, no database container).
# =============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: hr-secrets
  namespace: hr-system
type: Opaque                         # generic key/value secret
stringData:                          # plain text here; Kubernetes stores it base64-encoded
  MONGODB_URI: "REPLACE_ME"          # MongoDB Atlas connection string
  JWT_SECRET: "REPLACE_ME"           # signs and verifies login tokens
  INTERNAL_API_KEY: "REPLACE_ME"     # shared key for service-to-service calls