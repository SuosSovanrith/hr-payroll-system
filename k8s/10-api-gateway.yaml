# =============================================================================
# API Gateway: the ONLY entry point. JWT check + RBAC, then proxies to the services. 2 replicas = load balancing.
# Owner : Member 1
# Apply : kubectl apply -f k8s/10-api-gateway.yaml
# Verify: kubectl get pods,svc -n hr-system -l app=api-gateway
# Shows : Deployment (keeps 2 pod(s) running) + ClusterIP Service (stable internal name "api-gateway:3000",
#         no external access) + ConfigMap/Secret env + shared log volume + health probes.
# Scaling demo (YAML only): change `replicas` below, run `kubectl apply -f k8s/10-api-gateway.yaml`, watch the pods.
# Rolling update demo: change any pod-template field (e.g. the memory limit) and apply again;
#   the Deployment replaces pods one at a time with zero downtime (maxUnavailable: 0).
#
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
  namespace: hr-system
  labels:
    app: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never take a gateway pod down before its replacement is ready
      maxSurge: 1
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      enableServiceLinks: false      # do not inject extra env vars for every Service
      securityContext:               # the image runs as the non-root "node" user (uid 1000)
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000                # lets that user write to the shared log volume
      containers:
        - name: api-gateway
          image: suossovanrith/hr-api-gateway:v1
          imagePullPolicy: Always
          # Log to the shared volume as well as to stdout: node runs as PID 1 (exec) so it receives SIGTERM
          # directly; a background `tee` copies everything it prints into /var/log/hr/<service>-<pod>.log.
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /var/log/hr
              mkfifo /tmp/out.fifo
              tee -a /var/log/hr/api-gateway-$HOSTNAME.log < /tmp/out.fifo &
              exec node src/server.js > /tmp/out.fifo 2>&1
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: hr-config
          env:
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: hr-secrets
                  key: JWT_SECRET
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hr-secrets
                  key: INTERNAL_API_KEY
          readinessProbe:            # Service sends traffic only to pods that answer here
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:             # Kubernetes restarts the container if this keeps failing
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi
          volumeMounts:
            - name: hr-logs
              mountPath: /var/log/hr
        # Second container in the SAME pod: shares the log volume with the gateway container.
        # View it with:  kubectl logs <gateway-pod> -c log-tail -n hr-system
        - name: log-tail
          image: busybox:1.36
          command: ["/bin/sh", "-c"]
          args:
            - |
              touch /var/log/hr/api-gateway-$HOSTNAME.log
              tail -n +1 -F /var/log/hr/api-gateway-$HOSTNAME.log
          resources:
            requests:
              cpu: 10m
              memory: 8Mi
            limits:
              cpu: 50m
              memory: 32Mi
          volumeMounts:
            - name: hr-logs
              mountPath: /var/log/hr
      volumes:
        - name: hr-logs
          persistentVolumeClaim:
            claimName: hr-logs
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: hr-system
  labels:
    app: api-gateway
spec:
  type: ClusterIP                    # reachable only inside the cluster
  selector:
    app: api-gateway
  ports:
    - port: 3000
      targetPort: 3000
