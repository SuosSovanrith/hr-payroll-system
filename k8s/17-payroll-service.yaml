# =============================================================================
# Payroll Service (database hr_payroll). Calls the Employee and Attendance services internally.
# -----------------------------------------------------------------------------
# Owner  : Member 3
# Apply  : kubectl apply -f k8s/17-payroll-service.yaml
# Verify : kubectl get pods,svc -n hr-system -l app=payroll-service
# Shows  : Deployment (keeps 1 pod running) + ClusterIP Service (stable internal
#          name "payroll-service:3007", no external access) + ConfigMap/Secret env
#          + shared log volume + health probes.
# =============================================================================

# -----------------------------------------------------------------------------
# Deployment: keeps the desired number of pods running
# -----------------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: payroll-service
  namespace: hr-system
  labels:
    app: payroll-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payroll-service
  template:
    metadata:
      labels:
        app: payroll-service
    spec:
      enableServiceLinks: false      # do not inject extra env vars for every Service

      # The image runs as the non-root "node" user (uid 1000)
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000                # lets that user write to the shared log volume

      containers:
        - name: payroll-service
          image: suossovanrith/hr-payroll-service:v1
          imagePullPolicy: Always

          # Log to the shared volume as well as to stdout: node runs as PID 1 (exec) so it receives SIGTERM
          # directly; a background `tee` copies everything it prints into /var/log/hr/<service>-<pod>.log.
          command: ["/bin/sh", "-c"]
          args:
            - |
              mkdir -p /var/log/hr
              mkfifo /tmp/out.fifo
              tee -a /var/log/hr/payroll-service-$HOSTNAME.log < /tmp/out.fifo &
              exec node src/server.js > /tmp/out.fifo 2>&1

          ports:
            - containerPort: 3007

          # Non-secret settings (service URLs, NODE_ENV, ...) from ConfigMap "hr-config"
          envFrom:
            - configMapRef:
                name: hr-config

          # Sensitive values come from Secret "hr-secrets"
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: hr-secrets
                  key: MONGODB_URI
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hr-secrets
                  key: INTERNAL_API_KEY

          # Service sends traffic only to pods that answer here
          readinessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 8
            periodSeconds: 10

          # Kubernetes restarts the container if this keeps failing
          livenessProbe:
            httpGet:
              path: /health
              port: 3007
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 300m
              memory: 256Mi

          volumeMounts:
            - name: hr-logs
              mountPath: /var/log/hr

      # Shared log volume (see 03-storage.yaml)
      volumes:
        - name: hr-logs
          persistentVolumeClaim:
            claimName: hr-logs
---
# -----------------------------------------------------------------------------
# Service: stable internal name for the pod(s) above
# -----------------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: payroll-service
  namespace: hr-system
  labels:
    app: payroll-service
spec:
  type: ClusterIP                    # reachable only inside the cluster
  selector:
    app: payroll-service
  ports:
    - port: 3007
      targetPort: 3007