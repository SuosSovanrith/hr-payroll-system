# =============================================================================
# OPTIONAL: one-off Job that creates the demo accounts (admin / hr / employee) in the database.
# Only needed when the Atlas database is empty; with the shared team database they already exist.
# Safe to run twice (existing emails are skipped).
# Owner : Member 3
# Apply : kubectl apply -f k8s/optional/40-seed-job.yaml
# Verify: kubectl logs job/seed-demo-users -n hr-system
# Re-run: kubectl delete job seed-demo-users -n hr-system --ignore-not-found ; then apply again
# =============================================================================
apiVersion: batch/v1
kind: Job
metadata:
  name: seed-demo-users
  namespace: hr-system
spec:
  backoffLimit: 3
  ttlSecondsAfterFinished: 600       # clean itself up 10 minutes after finishing
  template:
    spec:
      restartPolicy: OnFailure
      enableServiceLinks: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
      containers:
        - name: seed
          image: suossovanrith/hr-registration-service:v1
          command: ["node", "src/scripts/seed.js"]
          envFrom:
            - configMapRef:
                name: hr-config
          env:
            - name: MONGODB_URI
              valueFrom:
                secretKeyRef:
                  name: hr-secrets
                  key: MONGODB_URI
            - name: INTERNAL_API_KEY
              valueFrom:
                secretKeyRef:
                  name: hr-secrets
                  key: INTERNAL_API_KEY
