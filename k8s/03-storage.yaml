# =============================================================================
# Shared log volume (PersistentVolumeClaim).
#   Every service pod mounts this claim at /var/log/hr and writes its log file there; the log-viewer pod
#   mounts the same claim read-only. One volume, many pods and containers.
#   Minikube's default StorageClass creates the disk automatically; the data survives pod restarts.
#   ReadWriteOnce is enough on a single-node cluster (all pods share the one node).
# Owner : Member 2
# Apply : kubectl apply -f k8s/03-storage.yaml
# Verify: kubectl get pvc -n hr-system      (STATUS should become Bound once the first pod uses it)
# =============================================================================
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: hr-logs
  namespace: hr-system
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
