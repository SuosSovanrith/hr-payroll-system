# Nginx = the ONLY public entry point. It load-balances (round robin) between the two gateway instances.
events {}

http {
  upstream gateways {
    # `least_conn;`  <- uncomment to balance by active connections instead of round robin
    server gateway1:3000;
    server gateway2:3000;
  }

  server {
    listen 80;

    location / {
      proxy_pass http://gateways;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Overwrite (do not append) so a client cannot forge its IP in audit logs
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;

      # Show which gateway container handled the request (visible in Postman response headers)
      add_header X-Upstream $upstream_addr always;
    }
  }
}
